<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="style2.css">
    <script src="script.js" defer></script>
</head>
<body>
        <p id="message"></p>
        <p id="price"></p>
    <div class="booking-card">
        <div class="card-left">
            <h2>Make your appointment</h2>
            <p>Наші майстрині будуть з радістю очікувати Вас на запис, де їхнім пріритетом буде - ваш комфорт та підтримання найвищого рівня послуг.</p>
        </div>
    <form class="card-right" id="form">
        <input type="text" class="name" id="name" placeholder="Name" required>
       <input type="tel" class="number" id="number" placeholder="Tel.Number" required>
      <input type="email" class="email" id="email" placeholder="Email" required>
       <select required class="service" id="service">
        <option value="" disabled selected hidden>Service</option>
        <option value="Classic Manicure">Classic Manicure</option>
        <option value="Gel Polish">Gel Polish</option>
        <option value="Nail Art">Nail Art</option>
       </select>
       <input type="date" class="date" id="date" required>
       <textarea placeholder="Comment" class="comment" id="comment"></textarea>
       <label class="check">
       <input type="checkbox" id="consent"> Я погоджуюсь  на обробку даних 
       </label>
       <input id="button" type="submit" class="submit" value="Надіслати">
    </form>
    </div>
</body>
</html>
